syntax = "proto3";
package audio;
option csharp_namespace = "AudioStretch.Protocol";

message Request {
  uint64 request_id = 1;
  string operation = 2;
  string input = 3;
  string output = 4;
  double tempo_change = 5;
  string encoding = 6;
  bool overwrite = 7;
  bool centre_focus = 8;
  Transform transform = 9;
  Maps maps = 10;
  string map_text = 11;
  MapKind map_kind = 12;
  bool map_seconds = 13;
  AudioInfo source_info = 14;
  string artifact_path = 15;
  TimeMode target_time_mode = 16;
  PitchMode target_pitch_mode = 17;
  string job_json = 18;
}
message AudioInfo {
  uint32 sample_rate = 1;
  uint32 channels = 2;
  uint32 bit_depth = 3;
  string codec = 4;
  double duration = 5;
  bool lossy = 6;
  uint64 frame_count = 7;
  string sha256 = 8;
}
message Snapshot {
  string state = 1;
  string stage = 2;
  string log = 3;
  string output = 4;
  double elapsed = 5;
  string error = 6;
  RenderPlan plan = 7;
  double actual_duration = 8;
  double duration_error = 9;
  string receipt_json = 10;
  repeated string warnings = 11;
}
message Reply {
  uint64 request_id = 1;
  string error = 2;
  AudioInfo info = 3;
  Snapshot snapshot = 4;
  RenderPlan plan = 5;
  Maps maps = 6;
  string text = 7;
  Transform transform = 8;
  Request job = 9;
}

enum TimeMode { TEMPO_CHANGE = 0; TEMPO_MULTIPLIER = 1; BPM = 2; TIME_RATIO = 3; DURATION = 4; }
enum PitchMode { UNCHANGED = 0; SEMITONES = 1; CENTS = 2; FREQUENCY = 3; }
enum MapKind { TIME = 0; PITCH = 1; FREQUENCY_MAP = 2; }
message Transform {
  TimeMode time_mode = 1;
  double time_value = 2;
  double source_bpm = 3;
  double target_bpm = 4;
  PitchMode pitch_mode = 5;
  double pitch_value = 6;
  bool preserve_formants = 7;
  bool realtime = 8;
  bool short_window = 9;
  bool pitch_hq = 10;
  bool clamp = 11;
  uint32 debug = 12;
  bool diagnostic_ticks = 13;
  bool quiet = 14;
}
message TimeAnchor { uint64 source_frame = 1; uint64 target_frame = 2; }
message PitchAnchor { uint64 source_frame = 1; double value = 2; }
message Maps {
  uint32 sample_rate = 1;
  uint64 source_frames = 2;
  string source_sha256 = 3;
  repeated TimeAnchor time_points = 4;
  repeated PitchAnchor pitch_points = 5;
  MapKind pitch_kind = 6;
}
message RenderPlan {
  double time_ratio = 1;
  double frequency_ratio = 2;
  double expected_duration = 3;
  bool realtime = 4;
  repeated string options = 5;
  string time_map_text = 6;
  string pitch_map_text = 7;
  MapKind pitch_kind = 8;
  repeated string warnings = 9;
  string summary = 10;
}
